name: Repair Upstream Sync

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-sync-branch:
    if: github.event_name == 'pull_request' && github.head_ref == 'sync/upstream-2026-07-29'
    name: Repair upstream sync branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: sync/upstream-2026-07-29
          fetch-depth: 0

      - name: Repair merged patchResult scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('LiveContainerSwiftUI/Models/LCAppInfo.m')
          text = path.read_text()
          old = '''                if(needPatch) {
                     int patchResult = LCPatchExecSlice(path, header, ![self dontInjectTweakLoader]);
                     if(patchResult & PATCH_EXEC_RESULT_NO_SPACE_FOR_TWEAKLOADER) {
                         info[@"LCTweakLoaderCantInject"] = @YES;
                         info[@"dontInjectTweakLoader"] = @YES;
                     }
                 }
                 if(patchResult & PATCH_EXEC_RESULT_SEG_COUNT_MISMATCH) {
                     info[@"segCountMismatch"] = @YES;
                 }
'''
          new = '''                if(needPatch) {
                     int patchResult = LCPatchExecSlice(path, header, ![self dontInjectTweakLoader]);
                     if(patchResult & PATCH_EXEC_RESULT_NO_SPACE_FOR_TWEAKLOADER) {
                         info[@"LCTweakLoaderCantInject"] = @YES;
                         info[@"dontInjectTweakLoader"] = @YES;
                     }
                     if(patchResult & PATCH_EXEC_RESULT_SEG_COUNT_MISMATCH) {
                         info[@"segCountMismatch"] = @YES;
                     }
                 }
'''
          if old not in text:
              raise SystemExit('Expected merged patchResult block was not found')
          path.write_text(text.replace(old, new, 1))
          PY

          rm -f .github/workflows/fix-lcappinfo-once.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair upstream merge and preserve 32-bit patching"
          git push origin HEAD:sync/upstream-2026-07-29
