name: Build Fresh 32-bit LiveContainer

on:
  push:
    branches:
      - fresh-32bit-upstream-2026-08-30
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build clean LiveContainer + LiveExec32 IPA
    runs-on: macos-latest
    env:
      LC_UPSTREAM_SHA: 12b1f782d760a43f47c9f7f77f1c270f7d888aac
      LIVEEXEC32_SHA: 467edd814ba4a52f5785e6c10518b73be26b2259
      DERIVED_DATA: build/DerivedData
      OUTPUT_IPA: LiveContainer-32bit-fresh-unsigned.ipa

    steps:
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Checkout fresh branch
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Verify clean upstream integration base
        run: |
          set -euxo pipefail
          grep -q 'LCSelected32BitEmulator' LiveContainer/LCBootstrap.m
          grep -q 'LC32BitTranslationLayer' LiveContainerSwiftUI/Models/LCAppInfo.m
          grep -q 'seedBundled32BitEmulator' LiveContainerSwiftUI/App/LiveContainerSwiftUIApp.swift
          test ! -e scripts/patch_livecontainer_32bit_host.py
          test ! -e scripts/patch_liveexec32.py
          test ! -e .github/build-triggers/architecture-metadata-fix-20260730.txt

      - name: Checkout LiveExec32 upstream
        uses: actions/checkout@v6
        with:
          repository: LiveContainer/LiveExec32
          ref: ${{ env.LIVEEXEC32_SHA }}
          path: build/LiveExec32

      - name: Prepare Theos
        run: |
          set -euxo pipefail
          brew install ldid
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$RUNNER_TEMP/theos"

      - name: Build LiveExec32 emulator
        env:
          THEOS: ${{ runner.temp }}/theos
        run: |
          set -euxo pipefail
          perl -0pi -e 's/(LiveExec32_CFLAGS = [^\n]*\n)/$1LiveExec32_CCFLAGS = -std=c++17\n/' build/LiveExec32/Makefile
          make -C build/LiveExec32 clean
          make -C build/LiveExec32

          LIVEEXEC_APP=$(find build/LiveExec32/.theos -type d -name 'LiveExec32.app' -print -quit)
          test -n "$LIVEEXEC_APP"
          test -f "$LIVEEXEC_APP/LiveExec32"
          test -f "$LIVEEXEC_APP/Info.plist"

          if [ -f build/LiveExec32/lib/libdynarmic.dylib ]; then
            cp build/LiveExec32/lib/libdynarmic.dylib "$LIVEEXEC_APP/"
            install_name_tool -id '@executable_path/libdynarmic.dylib' "$LIVEEXEC_APP/libdynarmic.dylib" || true
            install_name_tool -change libdynarmic.dylib '@executable_path/libdynarmic.dylib' "$LIVEEXEC_APP/LiveExec32" || true
            install_name_tool -change '@rpath/libdynarmic.dylib' '@executable_path/libdynarmic.dylib' "$LIVEEXEC_APP/LiveExec32" || true
          fi

          /usr/libexec/PlistBuddy -c 'Delete :LC32BitTranslationLayer' "$LIVEEXEC_APP/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c 'Add :LC32BitTranslationLayer bool true' "$LIVEEXEC_APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Delete :LCBundledSourceCommit' "$LIVEEXEC_APP/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LCBundledSourceCommit string $LIVEEXEC32_SHA" "$LIVEEXEC_APP/Info.plist"

          echo "LIVEEXEC_APP=$LIVEEXEC_APP" >> "$GITHUB_ENV"
          /usr/libexec/PlistBuddy -c 'Print :LC32BitTranslationLayer' "$LIVEEXEC_APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :LCBundledSourceCommit' "$LIVEEXEC_APP/Info.plist"
          file "$LIVEEXEC_APP/LiveExec32"

      - name: Build LiveContainer without signing
        run: |
          set -euxo pipefail
          xcodebuild build \
            -project LiveContainer.xcodeproj \
            -scheme LiveContainer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package combined unsigned IPA
        run: |
          set -euxo pipefail
          APP_PATH=$(find "$DERIVED_DATA/Build/Products/Release-iphoneos" -maxdepth 2 -type d -name 'LiveContainer.app' -print -quit)
          test -n "$APP_PATH"
          test -d "$APP_PATH"
          test -n "${LIVEEXEC_APP:-}"
          test -d "$LIVEEXEC_APP"

          rm -rf Payload "$OUTPUT_IPA"
          mkdir -p Payload
          ditto "$APP_PATH" Payload/LiveContainer.app
          rm -rf Payload/LiveContainer.app/LiveExec32.app
          ditto "$LIVEEXEC_APP" Payload/LiveContainer.app/LiveExec32.app

          # Leave the deliverable genuinely unsigned. SideStore/AltStore can sign
          # the host and nested emulator together at install time.
          find Payload -type d -name '_CodeSignature' -prune -exec rm -rf {} + || true
          find Payload -type f -name 'embedded.mobileprovision' -delete || true

          chmod +x Payload/LiveContainer.app/LiveContainer
          chmod +x Payload/LiveContainer.app/LiveExec32.app/LiveExec32
          ditto -c -k --sequesterRsrc --keepParent Payload "$OUTPUT_IPA"

      - name: Verify combined IPA contract
        run: |
          set -euxo pipefail
          rm -rf ipa-check
          unzip -q "$OUTPUT_IPA" -d ipa-check

          HOST=ipa-check/Payload/LiveContainer.app
          EMU="$HOST/LiveExec32.app"
          test -f "$HOST/LiveContainer"
          test -f "$EMU/LiveExec32"
          test -f "$EMU/Info.plist"
          test ! -e "$HOST/embedded.mobileprovision"
          test ! -d "$HOST/_CodeSignature"

          test "$(/usr/libexec/PlistBuddy -c 'Print :LC32BitTranslationLayer' "$EMU/Info.plist")" = "true"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LCBundledSourceCommit' "$EMU/Info.plist")" = "$LIVEEXEC32_SHA"
          grep -q 'bundled32BitEmulatorName = "LiveExec32.app"' LiveContainerSwiftUI/App/LiveContainerSwiftUIApp.swift
          grep -q 'LCSelected32BitEmulator' LiveContainerSwiftUI/App/LiveContainerSwiftUIApp.swift
          grep -q 'selected32BitEmulator' LiveContainer/LCBootstrap.m

          echo "Host architectures: $(lipo -archs "$HOST/LiveContainer")"
          echo "Emulator architectures: $(lipo -archs "$EMU/LiveExec32")"
          ls -lh "$OUTPUT_IPA"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: LiveContainer-32bit-fresh-unsigned
          path: ${{ env.OUTPUT_IPA }}
          if-no-files-found: error
          retention-days: 14
