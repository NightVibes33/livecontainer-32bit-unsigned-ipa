name: Apply LC32 Service MIG Patch

on:
  pull_request:
    paths:
      - 'tools/apply-lc32-service-mig.py'
      - '.github/workflows/apply-lc32-service-mig.yml'

permissions:
  contents: write

jobs:
  apply-service-mig:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/liveexec32-fixitfelix
      - run: python3 tools/apply-lc32-service-mig.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add runtime/LC32DarwinSyscalls.cpp runtime/tests/LC32DarwinSyscallsTests.cpp
          git commit -m 'Add deterministic service MIG responses'
          git push origin HEAD:feature/liveexec32-fixitfelix
