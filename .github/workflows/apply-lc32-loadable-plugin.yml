name: Apply LC32 Loadable Plugin

on:
  pull_request:
    paths:
      - 'tools/apply-lc32-loadable-plugin.py'
      - '.github/workflows/apply-lc32-loadable-plugin.yml'

permissions:
  contents: write

jobs:
  apply-plugin-loader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/liveexec32-fixitfelix
      - run: python3 tools/apply-lc32-loadable-plugin.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add LiveContainer/LCBootstrap.m
          git commit -m 'Load no-JIT LC32 runtime through dylib plugin'
          git push origin HEAD:feature/liveexec32-fixitfelix
