name: Apply LC32 Mach Message Runtime Patch

on:
  pull_request:
    paths:
      - 'tools/apply_mach_msg_runtime.py'

permissions:
  contents: read

jobs:
  apply-mach-msg-runtime:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply Mach message runtime patch
        run: python3 tools/apply_mach_msg_runtime.py
      - name: Commit runtime and tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/LC32DarwinSyscalls.hpp runtime/LC32DarwinSyscalls.cpp runtime/tests/LC32DarwinSyscallsTests.cpp
          git commit -m "runtime: add deterministic Mach message queues"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
