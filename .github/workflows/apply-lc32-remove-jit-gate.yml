name: Remove LC32 JIT Gate

on:
  pull_request:
    paths:
      - 'tools/remove-lc32-jit-gate.py'
      - '.github/workflows/apply-lc32-remove-jit-gate.yml'

permissions:
  contents: write

jobs:
  remove-jit-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/liveexec32-fixitfelix
      - run: python3 tools/remove-lc32-jit-gate.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add LiveContainer/LCBootstrap.m
          git commit -m 'Route 32-bit apps through no-JIT LiveExec32 runtime'
          git push origin HEAD:feature/liveexec32-fixitfelix
