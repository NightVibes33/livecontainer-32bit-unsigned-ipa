name: Apply LiveExec32 shared-loader source fix

on:
  push:
    branches:
      - fix-liveexec32-shared-loader-2026-08-30
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: fix-liveexec32-shared-loader-2026-08-30
          fetch-depth: 0

      - name: Patch LiveContainer 32-bit loader
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('LiveContainer/LCBootstrap.m')
          text = path.read_text()

          if 'LC32RunGuest' in text and 'LiveExec32Shared.framework/LiveExec32Shared' in text:
              print('LiveExec32 shared-loader fix is already applied.')
              raise SystemExit(0)

          old = '''    bool is32bit = [guestAppInfo[@"is32bit"] boolValue];
          if(is32bit) {'''
          new = '''    bool is32bit = [guestAppInfo[@"is32bit"] boolValue];
          const char *emulatorExecPath = NULL;
          const char *loadExecPath = appExecPath;
          if(is32bit) {'''
          assert text.count(old) == 1, '32-bit loader prologue changed upstream'
          text = text.replace(old, new, 1)

          old = '''        // maybe need to save selected32bitLayerBundle to static variable?
                  appExecPath = strdup(selected32bitLayerBundle.executablePath.UTF8String);
                  overwriteExecPath(appExecPath);
              }'''
          new = '''        // LiveExec32 is now split into a normal launcher executable plus a
                  // loadable shared framework. dyld refuses to dlopen an MH_EXECUTE image,
                  // so keep the launcher path for argv[0]/RootFS resolution and load the
                  // framework entry point instead.
                  emulatorExecPath = strdup(selected32bitLayerBundle.executablePath.UTF8String);
                  NSString *sharedFrameworkPath = [selected32bitLayerBundle.bundlePath
                      stringByAppendingPathComponent:@"Frameworks/LiveExec32Shared.framework/LiveExec32Shared"];
                  if(![fm fileExistsAtPath:sharedFrameworkPath]) {
                      appError = @"The selected 32-bit emulator is missing LiveExec32Shared.framework";
                      NSLog(@"[LCBootstrap] %@", appError);
                      *path = oldPath;
                      return appError;
                  }
                  loadExecPath = strdup(sharedFrameworkPath.fileSystemRepresentation);
                  overwriteExecPath(emulatorExecPath);
              }'''
          assert text.count(old) == 1, '32-bit emulator executable block changed upstream'
          text = text.replace(old, new, 1)

          old = '''        appHandle = dlopen_nolock(appExecPath, RTLD_LAZY|RTLD_GLOBAL|RTLD_FIRST);'''
          new = '''        appHandle = dlopen_nolock(loadExecPath, RTLD_LAZY|RTLD_GLOBAL|RTLD_FIRST);'''
          assert text.count(old) == 1, 'dlopen target changed upstream'
          text = text.replace(old, new, 1)

          old = '''    // Find main()
              appMain = getAppEntryPoint(appHandle);
              if (!appMain) {
                  appError = @"Could not find the main entry point";'''
          new = '''    // Find main(). 32-bit emulators expose a framework ABI rather than an
              // LC_MAIN entry point because their app launcher is not dlopen-able.
              if(is32bit) {
                  dlerror();
                  appMain = (int (*)(int, char **, char **))dlsym(appHandle, "LC32RunGuest");
                  const char *entryError = dlerror();
                  if(entryError) {
                      NSLog(@"[LCBootstrap] LC32RunGuest lookup failed: %s", entryError);
                      appMain = NULL;
                  }
              } else {
                  appMain = getAppEntryPoint(appHandle);
              }
              if (!appMain) {
                  appError = is32bit ? @"Could not find LC32RunGuest in the selected 32-bit emulator" : @"Could not find the main entry point";'''
          assert text.count(old) == 1, 'main entry-point block changed upstream'
          text = text.replace(old, new, 1)

          old = '''        char *argv32[] = {(char*)appExecPath, (char*)*path, NULL};'''
          new = '''        char *argv32[] = {(char*)emulatorExecPath, (char*)*path, NULL};'''
          assert text.count(old) == 1, '32-bit argv block changed upstream'
          text = text.replace(old, new, 1)

          path.write_text(text)
          print('Applied LiveExec32 shared-framework loader fix.')
          PY

      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- LiveContainer/LCBootstrap.m; then
            echo 'No source change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add LiveContainer/LCBootstrap.m
          git commit -m 'Load LiveExec32 through shared framework ABI'
          git push origin HEAD:fix-liveexec32-shared-loader-2026-08-30
