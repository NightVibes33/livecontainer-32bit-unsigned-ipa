name: Trace Beemo 2.2.5 Cordova startup

on:
  push:
    branches:
      - diag-yugioh-freeze-20260916
    paths:
      - '.github/workflows/beemo-startup-analysis.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Download exact Beemo 2.2.5
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request, urllib.parse
          identifier='cartoon-network-ios-archive'
          wanted='Adventure Time/Beemo v2.2.5 (IOS 5.0+).ipa'
          headers={'User-Agent':'Mozilla/5.0'}
          with urllib.request.urlopen(urllib.request.Request('https://archive.org/metadata/'+identifier, headers=headers), timeout=120) as r:
              meta=json.load(r)
          names={f.get('name','') for f in meta.get('files',[])}
          if wanted not in names:
              raise SystemExit('exact Beemo 2.2.5 archive entry missing')
          url='https://archive.org/download/{}/{}'.format(identifier, urllib.parse.quote(wanted, safe='/()[]!$&\'*,;=:@-_.~'))
          req=urllib.request.Request(url, headers=headers)
          with urllib.request.urlopen(req, timeout=240) as r, open('/tmp/beemo.ipa','wb') as f:
              while True:
                  chunk=r.read(1024*1024)
                  if not chunk: break
                  f.write(chunk)
          PY
          sha256sum /tmp/beemo.ipa
          mkdir -p /tmp/beemo
          unzip -q /tmp/beemo.ipa -d /tmp/beemo

      - name: Trace startup and credits state machine
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find /tmp/beemo/Payload -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP"
          OUT="$RUNNER_TEMP/beemo-startup"
          mkdir -p "$OUT/web"
          cp "$APP/Info.plist" "$OUT/Info.plist"
          find "$APP" -type f \( -iname '*.html' -o -iname '*.htm' -o -iname '*.js' -o -iname '*.css' -o -iname '*.json' -o -iname 'config.xml' \) -print0 |
            while IFS= read -r -d '' f; do
              rel=${f#"$APP"/}
              mkdir -p "$OUT/web/$(dirname "$rel")"
              cp "$f" "$OUT/web/$rel"
            done
          python3 - "$APP" "$OUT" <<'PY'
          import os, plistlib, re, sys, json
          from pathlib import Path
          app=Path(sys.argv[1]); out=Path(sys.argv[2])
          with open(app/'Info.plist','rb') as f: info=plistlib.load(f)
          text_ext={'.html','.htm','.js','.css','.json','.xml'}
          files=[p for p in app.rglob('*') if p.is_file() and p.suffix.lower() in text_ext]
          patterns={
              'cordova':['cordova','phonegap','deviceready','ondeviceready'],
              'credits':['credit','credits'],
              'navigation':['location.href','window.location','document.location','loadurl','openurl'],
              'timers':['settimeout','setinterval','cleartimeout','clearinterval'],
              'network':['xmlhttprequest','$.ajax','ajax(','http://','https://'],
              'viewport':['viewport','device-width','innerwidth','innerheight','screen.width','screen.height','orientation','resize'],
              'storage':['localstorage','sessionstorage','sqlite','filesystem','getfile'],
              'audio':['lowlatencyaudio','media(','audiocontext','playeffect','playsound'],
          }
          rows=[]
          for p in files:
              try: lines=p.read_text(errors='ignore').splitlines()
              except Exception: continue
              rel=str(p.relative_to(app))
              for i,line in enumerate(lines,1):
                  low=line.lower()
                  cats=[cat for cat,needles in patterns.items() if any(n in low for n in needles)]
                  if cats:
                      rows.append({'file':rel,'line':i,'categories':cats,'text':line[:800]})
          entry=[]
          for name in ('www/index.html','index.html','www/config.xml','config.xml'):
              p=app/name
              if p.exists(): entry.append(name)
          summary={
              'bundle_id':info.get('CFBundleIdentifier'),
              'version':info.get('CFBundleShortVersionString'),
              'minimum_os':info.get('MinimumOSVersion'),
              'device_family':info.get('UIDeviceFamily'),
              'orientations':info.get('UISupportedInterfaceOrientations'),
              'entry_candidates':entry,
              'web_file_count':len(files),
              'signal_count':len(rows),
          }
          (out/'summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          (out/'startup-signals.json').write_text(json.dumps(rows,indent=2)+'\n')
          with open(out/'startup-signals.txt','w') as f:
              for r in rows:
                  f.write(f"{r['file']}:{r['line']} [{','.join(r['categories'])}] {r['text']}\n")
          # Add focused context around deviceready/credits/navigation so the artifact is directly reviewable.
          focus=[]
          for p in files:
              try: lines=p.read_text(errors='ignore').splitlines()
              except Exception: continue
              rel=str(p.relative_to(app))
              hits=[i for i,l in enumerate(lines) if re.search(r'deviceready|credits?|location\.href|window\.location|setTimeout|XMLHttpRequest|\.ajax\b',l,re.I)]
              for i in hits:
                  lo=max(0,i-8); hi=min(len(lines),i+9)
                  focus.append(f"\n===== {rel}:{i+1} =====\n"+'\n'.join(f'{n+1:5}: {lines[n]}' for n in range(lo,hi)))
          (out/'focused-context.txt').write_text('\n'.join(focus))
          print(json.dumps(summary,indent=2))
          PY

      - name: Validate extracted startup surface
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/beemo-startup"
          test -s "$OUT/summary.json"
          test -s "$OUT/startup-signals.json"
          cat "$OUT/summary.json"
          head -n 400 "$OUT/startup-signals.txt" || true

      - name: Upload Beemo startup sources and trace
        uses: actions/upload-artifact@v4
        with:
          name: beemo-2.2.5-cordova-startup
          path: ${{ runner.temp }}/beemo-startup
          if-no-files-found: error
          retention-days: 30
