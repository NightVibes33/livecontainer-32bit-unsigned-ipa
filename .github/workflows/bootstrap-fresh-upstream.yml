name: Bootstrap Fresh Upstream

on:
  push:
    branches:
      - fresh-32bit-upstream-2026-08-30
    paths:
      - .github/workflows/bootstrap-fresh-upstream.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reset-to-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: fresh-32bit-upstream-2026-08-30
          fetch-depth: 0

      - name: Replace branch source with exact LiveContainer upstream
        env:
          UPSTREAM_SHA: 12b1f782d760a43f47c9f7f77f1c270f7d888aac
        run: |
          set -euxo pipefail
          tmp="$(mktemp -d)"
          git clone https://github.com/LiveContainer/LiveContainer.git "$tmp/upstream"
          git -C "$tmp/upstream" checkout "$UPSTREAM_SHA"

          # The Actions token cannot create/delete workflow files. Preserve the
          # current workflow directory for this one reset commit; workflows are
          # replaced separately through the GitHub connector afterwards.
          mkdir -p "$tmp/current"
          cp -a "$GITHUB_WORKSPACE/.github/workflows" "$tmp/current/workflows"

          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          rsync -a --delete --exclude .git/ --exclude '.github/workflows/' "$tmp/upstream/" "$GITHUB_WORKSPACE/"
          mkdir -p "$GITHUB_WORKSPACE/.github"
          rm -rf "$GITHUB_WORKSPACE/.github/workflows"
          cp -a "$tmp/current/workflows" "$GITHUB_WORKSPACE/.github/workflows"

          cat > "$GITHUB_WORKSPACE/UPSTREAM_BASE.md" <<'EOF'
          # Fresh 32-bit base

          LiveContainer upstream base: `12b1f782d760a43f47c9f7f77f1c270f7d888aac`
          LiveExec32 upstream base: `467edd814ba4a52f5785e6c10518b73be26b2259`

          The previous July 2026 custom LiveExec32 host/JIT patch stack was intentionally discarded.
          EOF

          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reset source to LiveContainer upstream 12b1f78"
          git push origin HEAD:fresh-32bit-upstream-2026-08-30
