name: Apply LC32 Mach Port Rights Patch

on:
  pull_request:
    paths:
      - 'tools/apply-lc32-mach-port-rights.py'
      - '.github/workflows/apply-lc32-mach-port-rights.yml'

permissions:
  contents: write

jobs:
  apply-mach-port-rights:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply Mach port rights patch
        run: python3 tools/apply-lc32-mach-port-rights.py
      - name: Commit runtime and tests
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add runtime/LC32DarwinSyscalls.hpp runtime/LC32DarwinSyscalls.cpp runtime/tests/LC32DarwinSyscallsTests.cpp
          git commit -m 'Add deterministic Mach port rights accounting'
          git push
