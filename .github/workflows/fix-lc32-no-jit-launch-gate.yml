name: Fix LC32 No-JIT Launch Gate

on:
  pull_request:
    paths:
      - 'tools/fix-lc32-no-jit-launch-gate.py'
      - '.github/workflows/fix-lc32-no-jit-launch-gate.yml'

permissions:
  contents: write

jobs:
  fix-no-jit-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/liveexec32-fixitfelix
      - run: python3 tools/fix-lc32-no-jit-launch-gate.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add LiveContainer/LCBootstrap.m
          git commit -m 'Route 32-bit launches into no-JIT interpreter'
          git push origin HEAD:feature/liveexec32-fixitfelix
