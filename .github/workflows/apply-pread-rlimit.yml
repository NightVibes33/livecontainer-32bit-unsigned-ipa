name: Apply LC32 pread and rlimit Patch

on:
  pull_request:
    paths:
      - 'tools/apply_pread_rlimit.py'
      - '.github/workflows/apply-pread-rlimit.yml'

permissions:
  contents: read

jobs:
  apply-pread-rlimit-patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply pread and rlimit runtime patch
        run: python3 tools/apply_pread_rlimit.py
      - name: Commit runtime and tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/LC32DarwinSyscalls.cpp runtime/tests/LC32DarwinSyscallsTests.cpp
          git commit -m "runtime: add pread and getrlimit support"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
