name: Apply LC32 RootFS Import

on:
  pull_request:
    paths:
      - 'tools/apply-lc32-rootfs-import.py'
      - '.github/workflows/apply-lc32-rootfs-import.yml'

permissions:
  contents: write

jobs:
  apply-rootfs-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/liveexec32-fixitfelix
      - run: python3 tools/apply-lc32-rootfs-import.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add runtime/LC32PluginMain.cpp LiveContainer/LCBootstrap.m LiveContainerSwiftUI/Views/Settings/LCSettingsView.swift
          git commit -m 'Add ARMv7 rootfs importer and detailed runtime errors'
          git push origin HEAD:feature/liveexec32-fixitfelix
