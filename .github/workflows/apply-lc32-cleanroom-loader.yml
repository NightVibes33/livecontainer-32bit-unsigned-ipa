name: Apply LC32 Cleanroom Loader

on:
  pull_request:
    paths:
      - 'tools/apply-lc32-cleanroom-loader.py'
      - '.github/workflows/apply-lc32-cleanroom-loader.yml'

permissions:
  contents: write

jobs:
  apply-cleanroom-loader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/liveexec32-fixitfelix
      - run: python3 tools/apply-lc32-cleanroom-loader.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add runtime/LC32PluginMain.cpp LiveContainer/LCBootstrap.m
          git commit -m 'Add rootfs-free clean-room loader discovery mode'
          git push origin HEAD:feature/liveexec32-fixitfelix
