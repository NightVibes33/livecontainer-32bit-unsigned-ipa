name: Apply memory control patch

on:
  push:
    branches:
      - feature/liveexec32-fixitfelix
    paths:
      - .github/workflows/apply-memory-control.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/liveexec32-fixitfelix
          fetch-depth: 0

      - name: Patch runtime memory controls
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              file.write_text(text.replace(old, new, 1))

          region_header = r'''#pragma once

#include <algorithm>
#include <cstddef>
#include <cstdint>
#include <utility>
#include <vector>

namespace lc32 {

namespace detail {

template <typename Region>
Region sliceRegion(const Region& source,
                   uint32_t base,
                   uint32_t size,
                   uint32_t protection) {
    Region out;
    out.base = base;
    out.size = size;
    out.protection = protection;
    const std::size_t offset = static_cast<std::size_t>(base - source.base);
    out.bytes.assign(source.bytes.begin() + offset,
                     source.bytes.begin() + offset + size);
    return out;
}

template <typename Region>
bool validRegionRange(uint32_t address, uint32_t size, uint64_t& end) {
    (void)sizeof(Region);
    if (size == 0) return false;
    end = static_cast<uint64_t>(address) + size;
    return end <= 0x100000000ull;
}

} // namespace detail

template <typename Region>
bool unmapRegionRange(std::vector<Region>& regions,
                      uint32_t address,
                      uint32_t size) {
    uint64_t end = 0;
    if (!detail::validRegionRange<Region>(address, size, end)) return false;

    std::vector<Region> updated;
    updated.reserve(regions.size() + 1u);
    for (const Region& region : regions) {
        const uint64_t regionEnd = static_cast<uint64_t>(region.base) + region.size;
        if (end <= region.base || address >= regionEnd) {
            updated.push_back(region);
            continue;
        }

        if (address > region.base) {
            const uint32_t leftSize = address - region.base;
            updated.push_back(detail::sliceRegion(
                region, region.base, leftSize, region.protection));
        }
        if (end < regionEnd) {
            const uint32_t rightBase = static_cast<uint32_t>(end);
            const uint32_t rightSize = static_cast<uint32_t>(regionEnd - end);
            updated.push_back(detail::sliceRegion(
                region, rightBase, rightSize, region.protection));
        }
    }
    regions = std::move(updated);
    return true;
}

template <typename Region>
bool protectRegionRange(std::vector<Region>& regions,
                        uint32_t address,
                        uint32_t size,
                        uint32_t protection) {
    uint64_t end = 0;
    if (!detail::validRegionRange<Region>(address, size, end)) return false;

    std::vector<std::pair<uint64_t, uint64_t>> coverage;
    for (const Region& region : regions) {
        const uint64_t regionEnd = static_cast<uint64_t>(region.base) + region.size;
        if (end <= region.base || address >= regionEnd) continue;
        coverage.push_back({std::max<uint64_t>(address, region.base),
                            std::min<uint64_t>(end, regionEnd)});
    }
    std::sort(coverage.begin(), coverage.end());
    uint64_t cursor = address;
    for (const auto& span : coverage) {
        if (span.first > cursor) return false;
        cursor = std::max(cursor, span.second);
        if (cursor >= end) break;
    }
    if (cursor < end) return false;

    std::vector<Region> updated;
    updated.reserve(regions.size() + 2u);
    for (const Region& region : regions) {
        const uint64_t regionEnd = static_cast<uint64_t>(region.base) + region.size;
        if (end <= region.base || address >= regionEnd) {
            updated.push_back(region);
            continue;
        }

        const uint32_t middleBase =
            static_cast<uint32_t>(std::max<uint64_t>(address, region.base));
        const uint32_t middleEnd =
            static_cast<uint32_t>(std::min<uint64_t>(end, regionEnd));

        if (middleBase > region.base) {
            updated.push_back(detail::sliceRegion(
                region,
                region.base,
                middleBase - region.base,
                region.protection));
        }
        updated.push_back(detail::sliceRegion(
            region, middleBase, middleEnd - middleBase, protection));
        if (middleEnd < regionEnd) {
            updated.push_back(detail::sliceRegion(
                region,
                middleEnd,
                static_cast<uint32_t>(regionEnd - middleEnd),
                region.protection));
        }
    }
    regions = std::move(updated);
    return true;
}

} // namespace lc32
'''
          Path("runtime/LC32RegionOperations.hpp").write_text(region_header)

          replace_once(
              "runtime/LC32DarwinSyscalls.hpp",
              "    std::function<bool(uint32_t, uint32_t, uint32_t)> map;\n",
              "    std::function<bool(uint32_t, uint32_t, uint32_t)> map;\n"
              "    std::function<bool(uint32_t, uint32_t)> unmap;\n"
              "    std::function<bool(uint32_t, uint32_t, uint32_t)> protect;\n")

          memory_cases = r'''        case 73: {
            const uint32_t address = state.r[0];
            const uint32_t length = state.r[1];
            if (length == 0 || length > kMaximumMapping ||
                (address & (kPageSize - 1u)) != 0) {
                return fail(number, EINVAL, "munmap range");
            }
            uint32_t mappedLength = 0;
            if (!alignPage(length, mappedLength) || mappedLength == 0 ||
                static_cast<uint64_t>(address) + mappedLength > 0x100000000ull) {
                return fail(number, EINVAL, "munmap aligned range");
            }
            if (!memory_.unmap) return fail(number, ENOSYS, "munmap callback");
            if (!memory_.unmap(address, mappedLength)) {
                return fail(number, EINVAL, "munmap guest range");
            }
            return ok(number, 0, "munmap");
        }
        case 74: {
            const uint32_t address = state.r[0];
            const uint32_t length = state.r[1];
            const uint32_t protection = state.r[2];
            if (length == 0 || length > kMaximumMapping ||
                (address & (kPageSize - 1u)) != 0) {
                return fail(number, EINVAL, "mprotect range");
            }
            if ((protection & ~(kProtRead | kProtWrite | kProtExec)) != 0) {
                return fail(number, EINVAL, "mprotect protection");
            }
            if ((protection & (kProtWrite | kProtExec)) ==
                (kProtWrite | kProtExec)) {
                return fail(number, EPERM, "mprotect W+X blocked");
            }
            uint32_t mappedLength = 0;
            if (!alignPage(length, mappedLength) || mappedLength == 0 ||
                static_cast<uint64_t>(address) + mappedLength > 0x100000000ull) {
                return fail(number, EINVAL, "mprotect aligned range");
            }
            if (!memory_.protect) return fail(number, ENOSYS, "mprotect callback");
            if (!memory_.protect(address, mappedLength, protection)) {
                return fail(number, ENOMEM, "mprotect guest range");
            }
            return ok(number, 0, "mprotect");
        }
'''
          replace_once(
              "runtime/LC32DarwinSyscalls.cpp",
              "        case 47:\n"
              "            return ok(number, static_cast<int32_t>(::getgid()), \"getgid\");\n"
              "        case 92: {\n",
              "        case 47:\n"
              "            return ok(number, static_cast<int32_t>(::getgid()), \"getgid\");\n" +
              memory_cases +
              "        case 92: {\n")

          for header in ("runtime/LC32BootSession.hpp", "runtime/LC32DyldBootSession.hpp"):
              replace_once(
                  header,
                  "    bool map(uint32_t address, uint32_t size, uint32_t protection);\n",
                  "    bool map(uint32_t address, uint32_t size, uint32_t protection);\n"
                  "    bool unmap(uint32_t address, uint32_t size);\n"
                  "    bool protect(uint32_t address, uint32_t size, uint32_t protection);\n")

          session_methods = r'''
bool {name}::unmap(uint32_t address, uint32_t size) {{
    return unmapRegionRange(regions_, address, size);
}}

bool {name}::protect(uint32_t address,
                     uint32_t size,
                     uint32_t protection) {{
    return protectRegionRange(regions_, address, size, protection);
}}
'''

          replace_once(
              "runtime/LC32BootSession.cpp",
              "#include \"LC32BootSession.hpp\"\n",
              "#include \"LC32BootSession.hpp\"\n"
              "#include \"LC32RegionOperations.hpp\"\n")
          replace_once(
              "runtime/LC32BootSession.cpp",
              "}\n\nbool BootSession::read(uint32_t address, void* data, std::size_t size) const {\n",
              "}\n" + session_methods.format(name="BootSession") +
              "\nbool BootSession::read(uint32_t address, void* data, std::size_t size) const {\n")
          replace_once(
              "runtime/LC32BootSession.cpp",
              "        [this](uint32_t address, uint32_t bytes, uint32_t protection) {\n"
              "            return map(address, bytes, protection);\n"
              "        }};\n",
              "        [this](uint32_t address, uint32_t bytes, uint32_t protection) {\n"
              "            return map(address, bytes, protection);\n"
              "        },\n"
              "        [this](uint32_t address, uint32_t bytes) {\n"
              "            return unmap(address, bytes);\n"
              "        },\n"
              "        [this](uint32_t address, uint32_t bytes, uint32_t protection) {\n"
              "            return protect(address, bytes, protection);\n"
              "        }};\n")

          replace_once(
              "runtime/LC32DyldBootSession.cpp",
              "#include \"LC32DyldBootSession.hpp\"\n",
              "#include \"LC32DyldBootSession.hpp\"\n"
              "#include \"LC32RegionOperations.hpp\"\n")
          replace_once(
              "runtime/LC32DyldBootSession.cpp",
              "}\n\nbool DyldBootSession::read(uint32_t address, void* data, std::size_t size) const {\n",
              "}\n" + session_methods.format(name="DyldBootSession") +
              "\nbool DyldBootSession::read(uint32_t address, void* data, std::size_t size) const {\n")
          replace_once(
              "runtime/LC32DyldBootSession.cpp",
              "         [this](uint32_t address, uint32_t size, uint32_t protection) {\n"
              "             return map(address, size, protection);\n"
              "         }},\n",
              "         [this](uint32_t address, uint32_t size, uint32_t protection) {\n"
              "             return map(address, size, protection);\n"
              "         },\n"
              "         [this](uint32_t address, uint32_t size) {\n"
              "             return unmap(address, size);\n"
              "         },\n"
              "         [this](uint32_t address, uint32_t size, uint32_t protection) {\n"
              "             return protect(address, size, protection);\n"
              "         }},\n")

          replace_once(
              "runtime/tests/LC32DarwinSyscallsTests.cpp",
              "#include \"../LC32DarwinSyscalls.hpp\"\n",
              "#include \"../LC32DarwinSyscalls.hpp\"\n"
              "#include \"../LC32RegionOperations.hpp\"\n")
          replace_once(
              "runtime/tests/LC32DarwinSyscallsTests.cpp",
              "    };\n\n    DarwinSyscalls syscalls(syscallMemory);\n",
              "    };\n"
              "    syscallMemory.unmap = [&](uint32_t address, uint32_t size) {\n"
              "        return unmapRegionRange(regions, address, size);\n"
              "    };\n"
              "    syscallMemory.protect = [&](uint32_t address,\n"
              "                                    uint32_t size,\n"
              "                                    uint32_t protection) {\n"
              "        return protectRegionRange(regions, address, size, protection);\n"
              "    };\n\n"
              "    DarwinSyscalls syscalls(syscallMemory);\n")

          tests = r'''
    state = {};
    state.r[12] = 74;
    state.r[0] = anonymousAddress + 0x1000u;
    state.r[1] = 1u;
    state.r[2] = kProtRead | kProtExec;
    const auto protectedPage = rooted.dispatch(state, 0x80u, false);
    assert(protectedPage.handled && protectedPage.errorNumber == 0);
    bool sawWritableFirstPage = false;
    bool sawExecutableSecondPage = false;
    for (const Region& region : regions) {
        if (region.base == anonymousAddress && region.size == 0x1000u) {
            sawWritableFirstPage = region.protection == (kProtRead | kProtWrite);
        }
        if (region.base == anonymousAddress + 0x1000u && region.size == 0x1000u) {
            sawExecutableSecondPage = region.protection == (kProtRead | kProtExec);
        }
    }
    assert(sawWritableFirstPage && sawExecutableSecondPage);

    state = {};
    state.r[12] = 74;
    state.r[0] = anonymousAddress;
    state.r[1] = 0x1000u;
    state.r[2] = kProtRead | kProtWrite | kProtExec;
    const auto writableExecutable = rooted.dispatch(state, 0x80u, false);
    assert(writableExecutable.handled && writableExecutable.errorNumber == EPERM);

    state = {};
    state.r[12] = 74;
    state.r[0] = anonymousAddress + 1u;
    state.r[1] = 0x1000u;
    state.r[2] = kProtRead;
    const auto unalignedProtect = rooted.dispatch(state, 0x80u, false);
    assert(unalignedProtect.handled && unalignedProtect.errorNumber == EINVAL);

    state = {};
    state.r[12] = 74;
    state.r[0] = 0x68000000u;
    state.r[1] = 0x1000u;
    state.r[2] = kProtRead;
    const auto missingProtect = rooted.dispatch(state, 0x80u, false);
    assert(missingProtect.handled && missingProtect.errorNumber == ENOMEM);

    state = {};
    state.r[12] = 73;
    state.r[0] = anonymousAddress + 0x1000u;
    state.r[1] = 1u;
    const auto unmappedPage = rooted.dispatch(state, 0x80u, false);
    assert(unmappedPage.handled && unmappedPage.errorNumber == 0);
    uint8_t removedByte = 0;
    assert(!syscallMemory.read(anonymousAddress + 0x1000u, &removedByte, 1));
    assert(syscallMemory.read(anonymousAddress, &removedByte, 1));

    const auto remappedPage = mmapGuest(anonymousAddress + 0x1000u,
                                        4096u,
                                        kProtRead | kProtWrite,
                                        kMapPrivate | kMapAnonymous,
                                        -1,
                                        0);
    assert(remappedPage.handled && remappedPage.errorNumber == 0);
    assert(state.r[0] == anonymousAddress + 0x1000u);

    state = {};
    state.r[12] = 73;
    state.r[0] = anonymousAddress + 1u;
    state.r[1] = 0x1000u;
    const auto unalignedUnmap = rooted.dispatch(state, 0x80u, false);
    assert(unalignedUnmap.handled && unalignedUnmap.errorNumber == EINVAL);

    state = {};
    state.r[12] = 73;
    state.r[0] = 0x69000000u;
    state.r[1] = 0x1000u;
    const auto emptyUnmap = rooted.dispatch(state, 0x80u, false);
    assert(emptyUnmap.handled && emptyUnmap.errorNumber == 0);
'''
          replace_once(
              "runtime/tests/LC32DarwinSyscallsTests.cpp",
              "    const auto badStack = rooted.dispatch(state, 0x80u, false);\n"
              "    assert(badStack.handled && badStack.errorNumber == EFAULT);\n\n"
              "    state = {};\n"
              "    state.r[12] = 92;\n",
              "    const auto badStack = rooted.dispatch(state, 0x80u, false);\n"
              "    assert(badStack.handled && badStack.errorNumber == EFAULT);\n" +
              tests +
              "\n    state = {};\n"
              "    state.r[12] = 92;\n")

          Path(".github/workflows/apply-memory-control.yml").unlink()
          PY

      - name: Commit memory controls
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "runtime: add munmap and mprotect support"
          git push origin HEAD:feature/liveexec32-fixitfelix
