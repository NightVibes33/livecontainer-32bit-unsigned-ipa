name: Apply memory control patch

on:
  push:
    branches:
      - feature/liveexec32-fixitfelix
    paths:
      - .github/workflows/apply-memory-control.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/liveexec32-fixitfelix
          fetch-depth: 0

      - name: Apply runtime patch
        run: python3 tools/apply_memory_control.py

      - name: Commit memory controls
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "runtime: add munmap and mprotect support"
          git push origin HEAD:feature/liveexec32-fixitfelix
