name: Test LC32 No-JIT Runtime

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'runtime/**'
      - 'tools/fix-lc32-interpreter-mask.py'
      - '.github/workflows/test-lc32-interpreter.yml'

permissions:
  contents: read

jobs:
  no-jit-runtime-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Apply decoder correctness fixes
        run: |
          set -euxo pipefail
          python3 tools/fix-lc32-interpreter-mask.py
          grep -q '0x0ff00000u' runtime/LC32Interpreter.cpp
      - name: Build interpreter tests
        run: |
          set -euxo pipefail
          c++ -std=c++17 -Wall -Wextra -Werror \
            runtime/LC32Interpreter.cpp \
            runtime/tests/LC32InterpreterTests.cpp \
            -o lc32-interpreter-tests
      - name: Run interpreter tests
        run: ./lc32-interpreter-tests
      - name: Build ARMv7 Mach-O loader tests
        run: |
          set -euxo pipefail
          c++ -std=c++17 -Wall -Wextra -Werror \
            runtime/LC32MachOLoader.cpp \
            runtime/tests/LC32MachOLoaderTests.cpp \
            -o lc32-macho-loader-tests
      - name: Run ARMv7 Mach-O loader tests
        run: ./lc32-macho-loader-tests
      - name: Build Darwin syscall tests
        run: |
          set -euxo pipefail
          c++ -std=c++17 -Wall -Wextra -Werror \
            runtime/LC32DarwinSyscalls.cpp \
            runtime/tests/LC32DarwinSyscallsTests.cpp \
            -o lc32-darwin-syscall-tests
      - name: Run Darwin syscall tests
        run: ./lc32-darwin-syscall-tests
