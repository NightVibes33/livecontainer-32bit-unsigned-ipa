name: YuGiOh deep freeze diagnostics

on:
  push:
    branches:
      - diag-yugioh-freeze-20260916
    paths:
      - '.github/workflows/yugioh-deep-diagnostics.yml'
  workflow_dispatch:

jobs:
  deep-inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq llvm file unzip

      - name: Download IPA
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request
          url='https://archive.org/download/yu-gi-oh-duel-generation/Yu-Gi-Oh%20Duel%20Generation.ipa'
          req=urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req, timeout=120) as r, open('/tmp/yugioh.ipa','wb') as f:
              while True:
                  b=r.read(1024*1024)
                  if not b: break
                  f.write(b)
          PY
          rm -rf /tmp/yugioh && mkdir -p /tmp/yugioh
          unzip -q /tmp/yugioh.ipa -d /tmp/yugioh
          sha256sum /tmp/yugioh.ipa

      - name: Trace likely freeze code paths
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find /tmp/yugioh/Payload -maxdepth 1 -type d -name '*.app' | head -n1)
          BIN="$APP/Yugioh"
          OUT="$RUNNER_TEMP/yugioh-deep-freeze-report.txt"
          DEM="$RUNNER_TEMP/yugioh-symbols-demangled.txt"
          DIS="$RUNNER_TEMP/yugioh-thumb-disassembly.txt"
          llvm-nm -n -C "$BIN" > "$DEM" || true

          # The game is Thumb/Thumb-2. Decode the entire text once so calls to
          # libpthread, libdispatch, curl, CFNetwork and OpenAL can be mapped
          # back to their caller functions rather than inferred from strings.
          llvm-objdump -d --demangle --triple=thumbv7-apple-ios "$BIN" > "$DIS" 2>&1 || true

          python3 - "$BIN" "$DEM" "$DIS" "$OUT" <<'PY'
          import collections, re, subprocess, sys
          binary, symbols_path, dis_path, out_path = sys.argv[1:]
          keywords = re.compile(
              r'(CCHttpClient|CURLRaii|SocketIO|SocketRocket|Server::|Networking|'
              r'SimpleAudioEngine|CDAudio|OpenAL|AVAudio|GameScene|DuelEngine|'
              r'FieldLayer|Battle|ready_timeout|Timeout|timeout)', re.I)
          targets = re.compile(
              r'<(_?pthread_(?:cond_wait|join|mutex_lock)|'
              r'_?dispatch_(?:group_wait|semaphore_wait|sync)|'
              r'_?curl_easy_perform|_?NSURLConnection|'
              r'_?alSourcePlay|_?alcMakeContextCurrent|_?AudioFileReadBytes|'
              r'_?ExtAudioFileRead)[^>]*>')

          symbols=[]
          for line in open(symbols_path, errors='replace'):
              m=re.match(r'^([0-9a-fA-F]+)\s+([A-Za-z?])\s+(.*)$', line.rstrip())
              if m:
                  symbols.append((int(m.group(1),16), m.group(3)))

          with open(out_path,'w') as out:
              out.write('=== BLOCKING IMPORT CALL SITES ===\n')
              current='(unknown)'
              ring=collections.deque(maxlen=14)
              hits=0
              for line in open(dis_path, errors='replace'):
                  header=re.match(r'^([0-9a-fA-F]+) <(.+)>:$', line.rstrip())
                  if header:
                      current=header.group(2)
                      ring.clear()
                  m=targets.search(line)
                  if m:
                      hits += 1
                      out.write(f'\n--- caller: {current}  target: {m.group(1)} ---\n')
                      for prev in ring: out.write(prev)
                      out.write(line)
                  ring.append(line)
              out.write(f'\nblocking call-site hits: {hits}\n')

              out.write('\n=== SELECTED SYMBOL DISASSEMBLY ===\n')
              matches=[]
              for i,(addr,name) in enumerate(symbols):
                  if keywords.search(name):
                      nxt=symbols[i+1][0] if i+1 < len(symbols) else addr+0x800
                      if nxt <= addr: nxt=addr+0x800
                      matches.append((addr,min(nxt,addr+0x1000),name))
              for addr,end,name in matches[:120]:
                  out.write(f'\n===== 0x{addr:08x}-0x{end:08x} {name} =====\n')
                  try:
                      p=subprocess.run([
                          'llvm-objdump','-d','--demangle',
                          '--triple=thumbv7-apple-ios',
                          f'--start-address=0x{addr:x}',f'--stop-address=0x{end:x}',
                          binary], stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                          text=True, timeout=15)
                      out.write(p.stdout)
                  except Exception as e:
                      out.write(f'[disassembly failed: {e}]\n')

              out.write('\n=== IMPORTANT SYMBOLS ===\n')
              for line in open(symbols_path, errors='replace'):
                  if keywords.search(line): out.write(line)
          PY

          {
            echo
            echo '=== NETWORK/HANG STRINGS WITH FILE OFFSETS ==='
            strings -a -t x "$BIN" | grep -Ei 'elasticbeanstalk|socket\.io|ready_timeout|heartbeatTimeout|timeout|Start Server Connection|onError|disconnected|CCHttpClient|pthread|semaphore|deadlock|OpenAL|Audio' | head -n 1600 || true
          } >> "$OUT"

          gzip -c "$DEM" > "$RUNNER_TEMP/yugioh-symbols-demangled.txt.gz"
          wc -l "$OUT"
          sed -n '1,260p' "$OUT"

      - name: Upload deep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yugioh-deep-freeze-diagnostics
          path: |
            ${{ runner.temp }}/yugioh-deep-freeze-report.txt
            ${{ runner.temp }}/yugioh-symbols-demangled.txt.gz
          if-no-files-found: error
