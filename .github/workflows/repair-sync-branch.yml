name: Repair sync branch

# Triggered after the workflow existed on the default branch.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/repair-sync-branch.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: sync/upstream-2026-07-29
          fetch-depth: 0

      - name: Repair LCAppInfo merge scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('LiveContainerSwiftUI/Models/LCAppInfo.m')
          text = path.read_text()
          old = '''                if(needPatch) {
                    int patchResult = LCPatchExecSlice(path, header, ![self dontInjectTweakLoader]);
                    if(patchResult & PATCH_EXEC_RESULT_NO_SPACE_FOR_TWEAKLOADER) {
                        info[@"LCTweakLoaderCantInject"] = @YES;
                        info[@"dontInjectTweakLoader"] = @YES;
                    }
                }
                if(patchResult & PATCH_EXEC_RESULT_SEG_COUNT_MISMATCH) {
                    info[@"segCountMismatch"] = @YES;
                }
'''
          new = '''                if(needPatch) {
                    int patchResult = LCPatchExecSlice(path, header, ![self dontInjectTweakLoader]);
                    if(patchResult & PATCH_EXEC_RESULT_NO_SPACE_FOR_TWEAKLOADER) {
                        info[@"LCTweakLoaderCantInject"] = @YES;
                        info[@"dontInjectTweakLoader"] = @YES;
                    }
                    if(patchResult & PATCH_EXEC_RESULT_SEG_COUNT_MISMATCH) {
                        info[@"segCountMismatch"] = @YES;
                    }
                }
'''
          if old not in text:
              raise SystemExit('Expected merged patchResult block was not found')
          path.write_text(text.replace(old, new, 1))
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LiveContainerSwiftUI/Models/LCAppInfo.m
          git commit -m "Repair merged patchResult scope"
          git push origin HEAD:sync/upstream-2026-07-29
