name: Validate iOSObscura IPA Batch

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/validate_iosobscura_batch.py'
      - '.github/workflows/validate-iosobscura.yml'
  workflow_dispatch:
    inputs:
      offset:
        description: Zero-based IPA offset in the archive
        required: true
        default: '0'
      limit:
        description: Number of IPAs to validate (1-250)
        required: true
        default: '25'
      max_file_mib:
        description: Maximum download size per IPA
        required: true
        default: '750'

permissions:
  contents: read

concurrency:
  group: iosobscura-${{ github.event.inputs.offset || '0' }}-${{ github.event.inputs.limit || '25' }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate archive batch
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      BATCH_OFFSET: ${{ github.event.inputs.offset || '0' }}
      BATCH_LIMIT: ${{ github.event.inputs.limit || '25' }}
      MAX_FILE_MIB: ${{ github.event.inputs.max_file_mib || '750' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BATCH_OFFSET" =~ ^[0-9]+$ ]]
          [[ "$BATCH_LIMIT" =~ ^[0-9]+$ ]]
          [[ "$MAX_FILE_MIB" =~ ^[0-9]+$ ]]
          test "$BATCH_LIMIT" -ge 1
          test "$BATCH_LIMIT" -le 250
          test "$MAX_FILE_MIB" -ge 1

      - name: Validate IPA batch
        run: |
          python3 tools/validate_iosobscura_batch.py \
            --offset "$BATCH_OFFSET" \
            --limit "$BATCH_LIMIT" \
            --max-file-mib "$MAX_FILE_MIB" \
            --output validation-results.json

      - name: Write job summary
        if: always()
        run: |
          if [ -f validation-results.json ]; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          data = json.loads(Path('validation-results.json').read_text())
          print('# iOSObscura validation batch')
          print()
          print(f"- Archive IPA files: {data['total_ipa_files']}")
          print(f"- Offset: {data['offset']}")
          print(f"- Processed: {data['processed']}")
          print(f"- Validated: {data['validated']}")
          print(f"- Failed: {data['failed']}")
          print(f"- ARMv7 candidates: {data['armv7_candidates']}")
          print(f"- ARM64-native packages: {data['arm64_native']}")
          print()
          print('| Index | Status | Architectures | Bundle ID | Archive path |')
          print('|---:|---|---|---|---|')
          for row in data['results']:
              arches = ', '.join(row.get('architectures', [])) or '-'
              bundle = row.get('bundle_id') or '-'
              name = row['archive_name'].replace('|', '\\|')
              print(f"| {row['archive_index']} | {row['status']} | {arches} | {bundle} | `{name}` |")
          PY
          else
            echo '# iOSObscura validation batch' >> "$GITHUB_STEP_SUMMARY"
            echo 'No result file was produced.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iosobscura-validation-${{ env.BATCH_OFFSET }}-${{ env.BATCH_LIMIT }}
          path: validation-results.json
          if-no-files-found: warn
          retention-days: 30
