name: Validate iOSObscura IPA Batch

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/validate_iosobscura_batch.py'
      - '.github/workflows/validate-iosobscura.yml'
  workflow_dispatch:
    inputs:
      offset:
        description: Zero-based IPA offset in the archive
        required: true
        default: '0'
      limit:
        description: Number of IPAs to validate (1-250)
        required: true
        default: '25'
      max_file_mib:
        description: Maximum download size per IPA
        required: true
        default: '750'

permissions:
  contents: read

concurrency:
  group: iosobscura-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  validate-push-shards:
    if: github.event_name == 'push'
    name: Validate archive shard ${{ matrix.offset }}-${{ matrix.end }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - offset: 0
            limit: 25
            end: 24
          - offset: 25
            limit: 25
            end: 49
          - offset: 50
            limit: 25
            end: 74
          - offset: 75
            limit: 25
            end: 99
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate IPA shard
        run: |
          python3 tools/validate_iosobscura_batch.py \
            --offset '${{ matrix.offset }}' \
            --limit '${{ matrix.limit }}' \
            --max-file-mib '750' \
            --output validation-results.json

      - name: Write job summary
        if: always()
        run: |
          if [ -f validation-results.json ]; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          data = json.loads(Path('validation-results.json').read_text())
          print('# iOSObscura validation shard')
          print()
          print(f"- Archive IPA files: {data['total_ipa_files']}")
          print(f"- Offset: {data['offset']}")
          print(f"- Processed: {data['processed']}")
          print(f"- Validated: {data['validated']}")
          print(f"- Failed: {data['failed']}")
          print(f"- ARMv7 candidates: {data['armv7_candidates']}")
          print(f"- ARM64-native packages: {data['arm64_native']}")
          PY
          else
            echo '# iOSObscura validation shard' >> "$GITHUB_STEP_SUMMARY"
            echo 'No result file was produced.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iosobscura-validation-${{ matrix.offset }}-${{ matrix.limit }}
          path: validation-results.json
          if-no-files-found: warn
          retention-days: 30

  validate-manual:
    if: github.event_name == 'workflow_dispatch'
    name: Validate manual archive batch
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      BATCH_OFFSET: ${{ inputs.offset }}
      BATCH_LIMIT: ${{ inputs.limit }}
      MAX_FILE_MIB: ${{ inputs.max_file_mib }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BATCH_OFFSET" =~ ^[0-9]+$ ]]
          [[ "$BATCH_LIMIT" =~ ^[0-9]+$ ]]
          [[ "$MAX_FILE_MIB" =~ ^[0-9]+$ ]]
          test "$BATCH_LIMIT" -ge 1
          test "$BATCH_LIMIT" -le 250
          test "$MAX_FILE_MIB" -ge 1

      - name: Validate IPA batch
        run: |
          python3 tools/validate_iosobscura_batch.py \
            --offset "$BATCH_OFFSET" \
            --limit "$BATCH_LIMIT" \
            --max-file-mib "$MAX_FILE_MIB" \
            --output validation-results.json

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iosobscura-validation-${{ env.BATCH_OFFSET }}-${{ env.BATCH_LIMIT }}
          path: validation-results.json
          if-no-files-found: warn
          retention-days: 30
