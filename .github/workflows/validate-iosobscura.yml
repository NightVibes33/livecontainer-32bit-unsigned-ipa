name: Validate iOSObscura IPA Batch

on:
  workflow_dispatch:
    inputs:
      offset:
        description: Zero-based IPA offset in the archive
        required: true
        default: '0'
      limit:
        description: Number of IPAs to validate (1-250)
        required: true
        default: '25'
      max_file_mib:
        description: Maximum download size per IPA
        required: true
        default: '750'

permissions:
  contents: read

concurrency:
  group: iosobscura-${{ inputs.offset }}-${{ inputs.limit }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate archive batch
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ '${{ inputs.offset }}' =~ ^[0-9]+$ ]]
          [[ '${{ inputs.limit }}' =~ ^[0-9]+$ ]]
          [[ '${{ inputs.max_file_mib }}' =~ ^[0-9]+$ ]]
          test '${{ inputs.limit }}' -ge 1
          test '${{ inputs.limit }}' -le 250
          test '${{ inputs.max_file_mib }}' -ge 1

      - name: Validate IPA batch
        run: |
          python3 tools/validate_iosobscura_batch.py \
            --offset '${{ inputs.offset }}' \
            --limit '${{ inputs.limit }}' \
            --max-file-mib '${{ inputs.max_file_mib }}' \
            --output validation-results.json

      - name: Write job summary
        if: always()
        run: |
          if [ -f validation-results.json ]; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          data = json.loads(Path('validation-results.json').read_text())
          print('# iOSObscura validation batch')
          print()
          print(f"- Archive IPA files: {data['total_ipa_files']}")
          print(f"- Offset: {data['offset']}")
          print(f"- Processed: {data['processed']}")
          print(f"- Validated: {data['validated']}")
          print(f"- Failed: {data['failed']}")
          print(f"- ARMv7 candidates: {data['armv7_candidates']}")
          print(f"- ARM64-native packages: {data['arm64_native']}")
          print()
          print('| Index | Status | Architectures | Bundle ID | Archive path |')
          print('|---:|---|---|---|---|')
          for row in data['results']:
              arches = ', '.join(row.get('architectures', [])) or '-'
              bundle = row.get('bundle_id') or '-'
              name = row['archive_name'].replace('|', '\\|')
              print(f"| {row['archive_index']} | {row['status']} | {arches} | {bundle} | `{name}` |")
          PY
          else
            echo '# iOSObscura validation batch' >> "$GITHUB_STEP_SUMMARY"
            echo 'No result file was produced.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iosobscura-validation-${{ inputs.offset }}-${{ inputs.limit }}
          path: validation-results.json
          if-no-files-found: warn
          retention-days: 30
