name: Build generic legacy-canvas LiveExec32

on:
  push:
    branches:
      - diag-yugioh-freeze-20260916
    paths:
      - '.github/scripts/patch-liveexec32-universal-canvas.py'
      - '.github/scripts/patch-liveexec32-cartoon-network-imports.py'
      - '.github/scripts/check-ipa-import-contract.py'
      - '.github/workflows/canvas-patch-build.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 100
    env:
      LIVEEXEC32_SHA: 3f0390e1b2725a2d3c9ab6f3976650a5a295ffba
      CN_CORPUS_RUN_ID: '35177939615'
    steps:
      - name: Checkout integration repo
        uses: actions/checkout@v7
      - name: Checkout pinned LiveExec32
        uses: actions/checkout@v7
        with:
          repository: LiveContainer/LiveExec32
          ref: ${{ env.LIVEEXEC32_SHA }}
          path: build/LiveExec32
          submodules: recursive
          persist-credentials: false
      - name: Restore extracted guest ramdisk
        id: ramdisk-cache
        uses: actions/cache/restore@v6
        with:
          path: build/LiveExec32/tmp/ipsw/ramdisk.dmg
          key: lc32-ramdisk-v1-3564d16366b053503107288be6cb335b2283cf14838ab64a88017c17a2a6a1bc
      - name: Install LiveExec32 build dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install make boost ldid
          theos="$RUNNER_TEMP/theos"
          theos_commit=5280bd038207e14f8bd76f5417aa2fe641c03228
          git init "$theos"
          git -C "$theos" remote add origin https://github.com/theos/theos.git
          git -C "$theos" fetch --depth 1 origin "$theos_commit"
          git -C "$theos" checkout --detach FETCH_HEAD
          git -C "$theos" submodule update --init --recursive --depth 1
          sdk_archive="$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz"
          curl --fail --location --retry 3 --output "$sdk_archive" \
            https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz
          echo "5e0fd3f01266cce4ce012d4a99b38eb56578fca40d09edc81cd83dee958202fb  $sdk_archive" | shasum -a 256 -c -
          mkdir -p "$theos/sdks"
          tar -xJf "$sdk_archive" -C "$theos/sdks"
          echo "THEOS=$theos" >> "$GITHUB_ENV"
          pzb_archive="$RUNNER_TEMP/pzb.zip"
          pzb_root="$RUNNER_TEMP/pzb"
          tools_dir="$RUNNER_TEMP/lc32-tools"
          curl --fail --location --retry 3 --output "$pzb_archive" \
            https://github.com/tihmstar/partialZipBrowser/releases/download/44/buildroot_macos-latest.zip
          echo "f72452e5c9c1248b8c4b4967a357b03addbe98d61ba8bad286ef0146dfdccdd2  $pzb_archive" | shasum -a 256 -c -
          mkdir -p "$pzb_root" "$tools_dir"
          unzip -q "$pzb_archive" -d "$pzb_root"
          install -m 0755 "$pzb_root/buildroot_macos-latest/usr/local/bin/pzb" "$tools_dir/pzb"
          echo "$tools_dir" >> "$GITHUB_PATH"
      - name: Generate upstream guest shims
        run: gmake -C build/LiveExec32/GuestMakefile generate-shims
      - name: Apply production compatibility patches plus generic legacy canvas
        shell: bash
        run: |
          set -euxo pipefail
          python3 .github/scripts/patch-liveexec32-missing-images.py
          python3 .github/scripts/patch-liveexec32-accelerate.py
          python3 .github/scripts/patch-liveexec32-coremedia.py
          python3 .github/scripts/patch-liveexec32-corpus-object-constants.py
          python3 .github/scripts/patch-liveexec32-quartzcore.py
          python3 .github/scripts/patch-liveexec32-target-coregraphics.py
          # host-argument invokes patch-liveexec32-universal-canvas.py internally.
          python3 .github/scripts/patch-liveexec32-host-argument.py
          python3 .github/scripts/patch-liveexec32-openal-session.py
          python3 .github/scripts/patch-liveexec32-noexecute-diagnostics.py
          python3 .github/scripts/patch-liveexec32-cartoon-network-imports.py
          grep -q 'LC32BundleSupportsLegacyPhoneCanvas' build/LiveExec32/include/LC32LegacyCanvas.h
          grep -q 'LC32LegacyIPadGeometryModeReflowPhoneController' build/LiveExec32/HostFrameworks/UIKit/UIKit.mm
          grep -q 'LC32ScreenNeedsLegacyPhoneCanvas' build/LiveExec32/GuestFrameworks/UIKit/UIKit.m
          test -f build/LiveExec32/GuestFrameworks/MediaToolbox/MediaToolbox.m
      - name: Build guest frameworks and assemble RootFS
        shell: bash
        run: |
          set -euxo pipefail
          gmake -C build/LiveExec32/GuestMakefile
          (cd build/LiveExec32 && bash GuestMakefile/pack-ramdisk.sh)

          root=build/LiveExec32/Resources/RootFS
          for framework in CoreSurface GraphicsServices PlugInKit WebKit; do
            source="$root/System/Library/Frameworks/$framework.framework"
            destination="$root/System/Library/PrivateFrameworks/$framework.framework"
            if [ ! -f "$source/$framework" ]; then
              echo "Runtime does not provide $framework yet; import coverage will report it"
              continue
            fi
            mkdir -p "$destination"
            cp "$source/$framework" "$destination/$framework"
            cp "$source/Info.plist" "$destination/Info.plist"
            chmod 0755 "$destination/$framework"
          done
          cp "$root/System/Library/Frameworks/LC32.framework/LC32" "$root/usr/lib/libresolv.9.dylib"
          chmod 0755 "$root/usr/lib/libresolv.9.dylib"
          bash .github/scripts/build-guest-libiconv.sh "$root"
      - name: Build patched LiveExec32 IPA
        run: gmake -C build/LiveExec32 package
      - name: Extract packaged RootFS
        shell: bash
        run: |
          set -euxo pipefail
          ipa=$(find build/LiveExec32/packages -maxdepth 1 -type f -name '*.ipa' -print -quit)
          test -n "$ipa"
          rm -rf build/packaged-runtime
          mkdir -p build/packaged-runtime
          unzip -q "$ipa" -d build/packaged-runtime
          app=$(find build/packaged-runtime/Payload -maxdepth 1 -type d -name 'LiveExec32.app' -print -quit)
          test -n "$app"
          test -d "$app/RootFS"
          echo "PACKAGED_ROOTFS=$app/RootFS" >> "$GITHUB_ENV"
      - name: Download exact 51-IPA Cartoon Network contract
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf build/cn-contract
          mkdir -p build/cn-contract
          gh run download "$CN_CORPUS_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name cartoon-network-full-corpus-summary \
            --dir build/cn-contract
          test -f build/cn-contract/cartoon-network-import-contract.json
          python3 - <<'PY'
          import json
          p='build/cn-contract/cartoon-network-import-contract.json'
          c=json.load(open(p))
          assert c['schema']==3
          assert c['app_id_field']=='archive_name'
          assert c['app_count']==51
          assert len(c['apps'])==51
          assert c['unresolved_binding_count']==0
          assert sum(x.get('image_count',0) for x in c['apps'].values())==51
          print('CN contract verified: 51 exact archive versions / 51 ARM32 images')
          PY
      - name: Audit all 51 Cartoon Network imports against packaged RootFS
        shell: bash
        run: |
          set -euxo pipefail
          python3 .github/scripts/check-ipa-import-contract.py \
            --contract build/cn-contract/cartoon-network-import-contract.json \
            --rootfs "$PACKAGED_ROOTFS" \
            --json-output build/cartoon-network-import-coverage.json \
            --markdown-output build/cartoon-network-import-coverage.md \
            --expected-app-count 51 \
            --expected-image-count 51 \
            --title 'LiveExec32 Cartoon Network 51-IPA import coverage'
          cat build/cartoon-network-import-coverage.md
      - name: Upload CN compatibility coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: LiveExec32-Cartoon-Network-51-import-coverage
          path: |
            build/cartoon-network-import-coverage.json
            build/cartoon-network-import-coverage.md
          if-no-files-found: warn
          retention-days: 90
      - name: Upload patched runtime
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: LiveExec32-generic-legacy-canvas
          path: build/LiveExec32/packages/*.ipa
          if-no-files-found: error
          retention-days: 30
