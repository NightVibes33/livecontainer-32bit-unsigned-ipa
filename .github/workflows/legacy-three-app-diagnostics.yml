name: Legacy three-app diagnostics

on:
  push:
    branches:
      - diag-yugioh-freeze-20260916
    paths:
      - '.github/workflows/legacy-three-app-diagnostics.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq llvm file unzip jq

      - name: Download exact Cartoon Network archive builds
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request, urllib.parse

          IDENTIFIER='cartoon-network-ios-archive'
          UA={'User-Agent':'Mozilla/5.0'}
          req=urllib.request.Request('https://archive.org/metadata/'+IDENTIFIER, headers=UA)
          with urllib.request.urlopen(req, timeout=120) as r:
              meta=json.load(r)
          names=[f.get('name','') for f in meta.get('files',[])]

          targets={
              'beemo': 'Adventure Time/Beemo v2.2.5 (IOS 5.0+).ipa',
              'regular-arcade': 'Regular Show/Just a Regular Arcade v3.4.0 (IOS 9.0+).ipa',
          }
          for label, wanted in targets.items():
              if wanted not in names:
                  matches=[n for n in names if n.lower().endswith('.ipa') and (
                      ('beemo' in n.lower() and '2.2.5' in n) if label == 'beemo'
                      else ('regular arcade' in n.lower() and '3.4.0' in n)
                  )]
                  raise SystemExit(f'{wanted!r} missing; matches={matches}')
              url='https://archive.org/download/{}/{}'.format(
                  IDENTIFIER, urllib.parse.quote(wanted, safe='/()[]!$&\'*,;=:@-_.~'))
              dest=f'/tmp/{label}.ipa'
              print('DOWNLOAD', label, url)
              req=urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=240) as r, open(dest,'wb') as f:
                  while True:
                      b=r.read(1024*1024)
                      if not b: break
                      f.write(b)
              print(label, 'bytes', __import__('os').path.getsize(dest))

          with open('/tmp/archive-files.txt','w') as f:
              for label, wanted in targets.items():
                  f.write(f'{label}: {wanted}\n')
          PY
          sha256sum /tmp/beemo.ipa /tmp/regular-arcade.ipa | tee /tmp/ipa-sha256.txt

      - name: Inspect exact Beemo 2.2.5
        shell: bash
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/reports"
          mkdir -p "$REPORT" /tmp/beemo225
          unzip -q /tmp/beemo.ipa -d /tmp/beemo225
          APP=$(find /tmp/beemo225/Payload -maxdepth 1 -type d -name '*.app' -print -quit)
          EXE=$(python3 - "$APP/Info.plist" <<'PY'
          import plistlib,sys
          with open(sys.argv[1],'rb') as f: print(plistlib.load(f)['CFBundleExecutable'])
          PY
          )
          BIN="$APP/$EXE"
          {
            echo '=== FILE ==='; file "$BIN"
            echo '=== PLIST ==='
            python3 - "$APP/Info.plist" <<'PY'
          import plistlib,pprint,sys
          with open(sys.argv[1],'rb') as f: pprint.pp(plistlib.load(f), sort_dicts=True)
          PY
            echo '=== MACH-O ==='; llvm-objdump --macho --private-headers "$BIN" || true
            echo '=== DYLIBS ==='; llvm-objdump --macho --dylibs-used "$BIN" || true
            echo '=== IMPORTS ==='; llvm-nm -u "$BIN" 2>/dev/null || true
            echo '=== APP TREE ==='; find "$APP" -maxdepth 4 -type f -printf '%P\n' | sort
            echo '=== CORDOVA / WEB SIGNALS ==='
            strings -a "$BIN" | grep -Ei 'Cordova|PhoneGap|UIWebView|WKWebView|webView|deviceready|LowLatencyAudio|AdMob|GAD|Flurry|credits?|splash|viewport|orientation|statusBar' || true
            echo '=== WEB FILE MATCHES ==='
            find "$APP" -type f \( -iname '*.html' -o -iname '*.htm' -o -iname '*.js' -o -iname '*.css' -o -iname '*.json' \) -print | sort
            echo '=== CREDITS / STARTUP / VIEWPORT SOURCE MATCHES ==='
            grep -RInaE --include='*.html' --include='*.htm' --include='*.js' --include='*.css' --include='*.json' \
              'credit|credits|deviceready|setTimeout|setInterval|splash|viewport|device-width|innerWidth|innerHeight|screen\.|orientation|resize|location\.href|window\.location|ajax|XMLHttpRequest|https?://' "$APP" 2>/dev/null | head -n 12000 || true
            echo '=== IMAGE DIMENSIONS ==='
            find "$APP" -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' \) -print0 | while IFS= read -r -d '' f; do file "$f" || true; done | head -n 5000
          } > "$REPORT/beemo-2.2.5.txt" 2>&1
          cp "$APP/Info.plist" "$REPORT/beemo-Info.plist"

      - name: Inspect exact Regular Arcade 3.4.0
        shell: bash
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/reports"
          mkdir -p "$REPORT" /tmp/regular340
          unzip -q /tmp/regular-arcade.ipa -d /tmp/regular340
          APP=$(find /tmp/regular340/Payload -maxdepth 1 -type d -name '*.app' -print -quit)
          EXE=$(python3 - "$APP/Info.plist" <<'PY'
          import plistlib,sys
          with open(sys.argv[1],'rb') as f: print(plistlib.load(f)['CFBundleExecutable'])
          PY
          )
          BIN="$APP/$EXE"
          {
            echo '=== FILE ==='; file "$BIN"
            echo '=== PLIST ==='
            python3 - "$APP/Info.plist" <<'PY'
          import plistlib,pprint,sys
          with open(sys.argv[1],'rb') as f: pprint.pp(plistlib.load(f), sort_dicts=True)
          PY
            echo '=== MACH-O ==='; llvm-objdump --macho --private-headers "$BIN" || true
            echo '=== DYLIBS ==='; llvm-objdump --macho --dylibs-used "$BIN" || true
            echo '=== IMPORTS ==='; llvm-nm -u "$BIN" 2>/dev/null || true
            echo '=== UNITY / RENDER / THREAD SIGNALS ==='
            strings -a "$BIN" | grep -Ei 'Unity|il2cpp|mono|Metal|OpenGLES|EAGL|glViewport|CVOpenGLES|display|screen|render|pthread|dispatch_(group|semaphore|sync)|Audio|OpenAL|crash|assert|error|timeout' | head -n 12000 || true
            echo '=== UNITY DATA TREE ==='
            find "$APP" -maxdepth 5 -type f -printf '%P\n' | grep -Ei '(^|/)(Data|Managed|Frameworks|Unity|globalgamemanagers|mainData|level|sharedassets|resources)' | head -n 12000 || true
          } > "$REPORT/regular-arcade-3.4.0.txt" 2>&1
          cp "$APP/Info.plist" "$REPORT/regular-arcade-Info.plist"

      - name: Emit compatibility summary
        shell: bash
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/reports"
          cp /tmp/archive-files.txt "$REPORT/"
          cp /tmp/ipa-sha256.txt "$REPORT/"
          {
            echo '=== BEEMO SUMMARY ==='
            grep -E 'CFBundleShortVersionString|MinimumOSVersion|UIDeviceFamily|UISupportedInterfaceOrientations|sdk |version |Cordova|PhoneGap|UIWebView|WKWebView|deviceready|credit|viewport|device-width|innerWidth|innerHeight|orientation|LowLatencyAudio' "$REPORT/beemo-2.2.5.txt" | head -n 1200 || true
            echo
            echo '=== REGULAR ARCADE SUMMARY ==='
            grep -E 'CFBundleShortVersionString|MinimumOSVersion|UIDeviceFamily|UISupportedInterfaceOrientations|sdk |version |Mach-O universal|armv7|arm64|Unity|Metal|OpenGLES|EAGL|CVOpenGLES|dispatch_group_wait|dispatch_semaphore_wait|pthread_join' "$REPORT/regular-arcade-3.4.0.txt" | head -n 1600 || true
          } | tee "$REPORT/summary.txt"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-three-app-diagnostics
          path: ${{ runner.temp }}/reports
          if-no-files-found: error
