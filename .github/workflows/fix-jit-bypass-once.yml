name: Fix inverted JIT bypass once

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/fix-jit-bypass-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Repair inverted bypass
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('LiveContainer/LCBootstrap.m')
          text = path.read_text()
          old = '''    if([lcUserDefaults boolForKey:@"LCIgnoreJITOnLaunch"]) {
                  return NO;
              }'''
          new = '''    if([lcUserDefaults boolForKey:@"LCIgnoreJITOnLaunch"]) {
                  // Explicit developer override: skip the launch-time JIT gate.
                  return YES;
              }'''
          if old not in text:
              raise SystemExit('Expected inverted JIT bypass block was not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add LiveContainer/LCBootstrap.m
          git commit -m 'Fix inverted JIT bypass setting'
          git push origin HEAD:main
