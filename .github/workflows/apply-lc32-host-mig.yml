name: Apply LC32 Host MIG Runtime Patch

on:
  pull_request:
    paths:
      - 'tools/apply-lc32-host-mig.py'
      - '.github/workflows/apply-lc32-host-mig.yml'

permissions:
  contents: write

jobs:
  apply-host-mig-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/liveexec32-fixitfelix
      - name: Apply host MIG runtime patch
        run: python3 tools/apply-lc32-host-mig.py
      - name: Commit runtime and tests
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add runtime/LC32DarwinSyscalls.cpp runtime/tests/LC32DarwinSyscallsTests.cpp
          git commit -m 'Add deterministic host MIG replies'
          git push origin HEAD:feature/liveexec32-fixitfelix
