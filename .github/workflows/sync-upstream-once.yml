name: One-time upstream sync

on:
  push:
    branches:
      - sync/upstream-2026-07-29
    paths:
      - .github/workflows/sync-upstream-once.yml

permissions:
  contents: write

jobs:
  sync:
    name: Merge latest LiveContainer upstream
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork branch
        uses: actions/checkout@v6
        with:
          ref: sync/upstream-2026-07-29
          fetch-depth: 0
          submodules: false

      - name: Merge upstream while preserving fork changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/LiveContainer/LiveContainer.git
          git fetch upstream main --tags

          echo "Fork before sync: $(git rev-parse HEAD)"
          echo "Upstream target:  $(git rev-parse upstream/main)"

          if ! git merge --no-edit --no-ff -X ours upstream/main; then
            echo "Upstream merge produced unresolved conflicts:" >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi

          grep -q 'is32BitSupported' .github/workflows/unsigned-ipa.yml
          grep -q 'LiveExec32' LiveContainer/LCBootstrap.m
          grep -q 'Rerouting 32-bit guest dlopen' LiveContainer/Tweaks/Dyld.m
          grep -q 'is32bit' LiveContainerSwiftUI/Models/LCAppInfo.m

          echo "Synced head: $(git rev-parse HEAD)"
          git push origin HEAD:sync/upstream-2026-07-29
