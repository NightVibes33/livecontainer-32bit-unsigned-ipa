name: Build Integrated 32-bit Runtime

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'LiveContainer/**'
      - 'tools/apply-liveexec32-runtime-integration.py'
      - '.github/workflows/build-integrated-liveexec32.yml'

permissions:
  contents: read

jobs:
  integrated-runtime:
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      LIVEEXEC32_COMMIT: 467edd814ba4a52f5785e6c10518b73be26b2259
      DERIVED_DATA: build/IntegratedDerivedData
      OUTPUT_IPA: LiveContainer-integrated32-unsigned.ipa
    steps:
      - name: Checkout LiveContainer fork
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Checkout pinned LiveExec32 source
        uses: actions/checkout@v6
        with:
          repository: LiveContainer/LiveExec32
          ref: ${{ env.LIVEEXEC32_COMMIT }}
          path: build/LiveExec32
          submodules: recursive

      - name: Apply in-repository runtime integration
        run: |
          set -euxo pipefail
          python3 tools/apply-liveexec32-runtime-integration.py .
          grep -q 'LC32_GUEST_EXECUTABLE' LiveContainer/LCBootstrap.m
          grep -q 'LC32_GUEST_EXECUTABLE' build/LiveExec32/main.cpp
          grep -q 'guest-dyld-mapped' build/LiveExec32/main.cpp
          if grep -q 'FS3 Mobile.app/FS3 Mobile' build/LiveExec32/main.cpp; then
            echo 'hard-coded LiveExec32 developer test application remains' >&2
            exit 1
          fi

      - name: Prepare Theos
        run: |
          set -euxo pipefail
          brew install ldid
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$RUNNER_TEMP/theos"

      - name: Build patched LiveExec32
        env:
          THEOS: ${{ runner.temp }}/theos
        run: |
          set -euxo pipefail
          perl -0pi -e 's/(LiveExec32_CFLAGS = [^\n]*\n)/$1LiveExec32_CCFLAGS = -std=c++17\n/' build/LiveExec32/Makefile
          make -C build/LiveExec32 clean
          make -C build/LiveExec32
          LIVEEXEC_APP=$(find build/LiveExec32/.theos -type d -name LiveExec32.app -print -quit)
          test -n "$LIVEEXEC_APP"
          test -f "$LIVEEXEC_APP/LiveExec32"
          strings "$LIVEEXEC_APP/LiveExec32" | grep -q 'LC32_GUEST_EXECUTABLE'
          strings "$LIVEEXEC_APP/LiveExec32" | grep -q 'guest-dyld-mapped'
          if [ -f build/LiveExec32/lib/libdynarmic.dylib ]; then
            cp build/LiveExec32/lib/libdynarmic.dylib "$LIVEEXEC_APP/"
            install_name_tool -id '@executable_path/libdynarmic.dylib' "$LIVEEXEC_APP/libdynarmic.dylib" || true
            install_name_tool -change libdynarmic.dylib '@executable_path/libdynarmic.dylib' "$LIVEEXEC_APP/LiveExec32" || true
            install_name_tool -change '@rpath/libdynarmic.dylib' '@executable_path/libdynarmic.dylib' "$LIVEEXEC_APP/LiveExec32" || true
          fi
          echo "LIVEEXEC_APP=$LIVEEXEC_APP" >> "$GITHUB_ENV"

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Build LiveContainer with native 64-bit and translated 32-bit routing
        run: |
          set -euxo pipefail
          xcodebuild build \
            -project LiveContainer.xcodeproj \
            -scheme LiveContainer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            PROVISIONING_PROFILE_SPECIFIER='' \
            GCC_PREPROCESSOR_DEFINITIONS='$(inherited) is32BitSupported=1' \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) is32BitSupported'

      - name: Embed patched runtime and package unsigned IPA
        run: |
          set -euxo pipefail
          APP=$(find "$DERIVED_DATA/Build/Products/Release-iphoneos" -maxdepth 2 -type d -name LiveContainer.app -print -quit)
          test -n "$APP"
          rm -rf "$APP/LiveExec32.app"
          ditto "$LIVEEXEC_APP" "$APP/LiveExec32.app"
          test -f "$APP/LiveExec32.app/LiveExec32"
          strings "$APP/LiveExec32.app/LiveExec32" | grep -q 'LC32_GUEST_EXECUTABLE'
          if ! grep -R -a -q --exclude='LiveExec32' 'LC32_GUEST_EXECUTABLE' "$APP"; then
            echo 'LiveContainer launch-contract marker is missing from all packaged host binaries' >&2
            find "$APP" -type f -maxdepth 5 -print >&2
            exit 1
          fi
          tools/package-unsigned-ipa.sh "$APP" "$OUTPUT_IPA"

      - name: Verify dual architecture routing package
        run: |
          set -euxo pipefail
          rm -rf verify-integrated
          unzip -q "$OUTPUT_IPA" -d verify-integrated
          APP=verify-integrated/Payload/LiveContainer.app
          test -f "$APP/LiveContainer"
          test -f "$APP/LiveExec32.app/LiveExec32"
          file "$APP/LiveContainer"
          file "$APP/LiveExec32.app/LiveExec32"
          grep -R -a -q 'JIT is required to run 32-bit apps through LiveExec32' "$APP"
          grep -R -a -q --exclude='LiveExec32' 'LC32_GUEST_EXECUTABLE' "$APP"
          strings "$APP/LiveExec32.app/LiveExec32" | grep -q 'guest-executable-mapped'
          strings "$APP/LiveExec32.app/LiveExec32" | grep -q 'guest-dyld-mapped'
          shasum -a 256 "$OUTPUT_IPA" > "$OUTPUT_IPA.sha256"

      - name: Upload integrated build
        uses: actions/upload-artifact@v4
        with:
          name: LiveContainer-integrated32-unsigned
          path: |
            ${{ env.OUTPUT_IPA }}
            ${{ env.OUTPUT_IPA }}.sha256
          if-no-files-found: error
