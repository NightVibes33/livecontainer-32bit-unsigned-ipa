name: Remove LiveExec32 JIT gate once

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/remove-liveexec32-jit-gate-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Remove hard LiveExec32 JIT gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('LiveContainer/LCBootstrap.m')
          text = path.read_text()
          old = '''    if(is32bit) {
        if (!isJitEnabled) {
            isJitEnabled = waitForJITEnabled(80, 1000 * 100);
            if(isJitEnabled) {
                init_bypassDyldLibValidation();
            }
        }
        if (!isJitEnabled) {
            return @"JIT is required to run 32-bit apps through LiveExec32.";
        }
        
        NSString *selected32BitLayerExecPath = nil;'''
          new = '''    if(is32bit) {
        if (!isJitEnabled) {
            NSLog(@"[LCBootstrap] LiveExec32 launch is continuing without an externally enabled JIT session. The translation backend will report any executable-memory failure directly.");
        } else {
            init_bypassDyldLibValidation();
        }
        
        NSString *selected32BitLayerExecPath = nil;'''
          if old not in text:
              raise SystemExit('Expected LiveExec32 JIT gate block was not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/remove-liveexec32-jit-gate-once.yml
          git add LiveContainer/LCBootstrap.m
          git commit -m 'Remove hard LiveExec32 JIT launch gate'
          git push origin HEAD:main
