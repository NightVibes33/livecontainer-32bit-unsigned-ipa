name: Fix import architecture refresh once

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/fix-import-architecture-refresh-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Refresh cached architecture in both directions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('LiveContainerSwiftUI/Models/LCAppInfo.m')
          text = path.read_text()

          old_else = '''#if is32BitSupported
              else if(!is32bit) {
                  is32bit = [self refreshIs32bitFromExecutable];
              }
          #endif'''
          new_else = '''#if is32BitSupported
              else {
                  // Cached architecture can be stale in either direction. Always let the executable repair it.
                  is32bit = [self refreshIs32bitFromExecutable];
              }
          #endif'''

          old_refresh = '''    __block bool has64bitSlice = false;
              NSString *error = LCParseMachO(execPath.UTF8String, true, ^(const char *path, struct mach_header_64 *header, int fd, void *filePtr) {
                  if(header->cputype == CPU_TYPE_ARM64) {
                      has64bitSlice = true;
                  }
              });
              if(error) {
                  NSLog(@"[LC] Failed to refresh 32-bit state for %@: %@", execPath, error);
                  return self.is32bit;
              }
              self.is32bit = !has64bitSlice;'''
          new_refresh = '''    __block bool foundMachOSlice = false;
              __block bool has64bitSlice = false;
              NSString *error = LCParseMachO(execPath.UTF8String, true, ^(const char *path, struct mach_header_64 *header, int fd, void *filePtr) {
                  foundMachOSlice = true;
                  if(header->cputype == CPU_TYPE_ARM64) {
                      has64bitSlice = true;
                  }
              });
              if(error || !foundMachOSlice) {
                  NSLog(@"[LC] Failed to refresh 32-bit state for %@: %@", execPath, error ?: @"no Mach-O slices found");
                  return self.is32bit;
              }
              self.is32bit = !has64bitSlice;'''

          if old_else not in text:
              raise SystemExit('Expected one-way cached architecture refresh block was not found')
          if old_refresh not in text:
              raise SystemExit('Expected refreshIs32bitFromExecutable block was not found')

          text = text.replace(old_else, new_else, 1)
          text = text.replace(old_refresh, new_refresh, 1)
          path.write_text(text)
          PY

          grep -q 'Cached architecture can be stale in either direction' LiveContainerSwiftUI/Models/LCAppInfo.m
          grep -q 'foundMachOSlice' LiveContainerSwiftUI/Models/LCAppInfo.m
          ! grep -q 'else if(!is32bit)' LiveContainerSwiftUI/Models/LCAppInfo.m

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-import-architecture-refresh-once.yml
          git add LiveContainerSwiftUI/Models/LCAppInfo.m
          git commit -m 'Refresh imported app architecture in both directions'
          git push origin HEAD:main
