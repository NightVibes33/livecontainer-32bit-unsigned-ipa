name: Dispatch YuGiOh Diagnostic Build

on:
  push:
    branches:
      - diag-yugioh-freeze-20260916
    paths:
      - '.github/workflows/dispatch-yugioh-diagnostic-build.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch full unsigned build at diagnostic ref
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: diag-yugioh-freeze-20260916
        shell: bash
        run: |
          set -euo pipefail
          payload=$(printf '{"ref":"%s"}' "$REF")
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/workflows/unsigned-ipa.yml/dispatches" \
            -d "$payload"
          echo "Dispatched unsigned-ipa.yml at $REF"
