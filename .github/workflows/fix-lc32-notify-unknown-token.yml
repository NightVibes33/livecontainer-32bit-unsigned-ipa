name: Fix LC32 Notify Unknown Token

on:
  pull_request:
    paths:
      - 'tools/fix-lc32-notify-unknown-token.py'
      - '.github/workflows/fix-lc32-notify-unknown-token.yml'

permissions:
  contents: write

jobs:
  fix-notify-token:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/liveexec32-fixitfelix
      - run: python3 tools/fix-lc32-notify-unknown-token.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add runtime/LC32DarwinSyscalls.hpp runtime/LC32DarwinSyscalls.cpp
          git commit -m 'Preserve unknown notify token compatibility'
          git push origin HEAD:feature/liveexec32-fixitfelix
