name: Fix LiveExec32 runtime integration once

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/fix-liveexec32-runtime-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Repair 32-bit runtime launch path
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          bootstrap = Path('LiveContainer/LCBootstrap.m')
          text = bootstrap.read_text()
          old = '''    if(is32bit) {
                  if (!isJitEnabled) {
                      isJitEnabled = waitForJITEnabled(80, 1000 * 100);
                      if(isJitEnabled) {
                          init_bypassDyldLibValidation();
                      }
                  }
                  if (!isJitEnabled) {
                      return @"JIT is required to run 32-bit apps through LiveExec32.";
                  }
                  
                  NSString *selected32BitLayerExecPath = nil;'''
          new = '''    if(is32bit) {
                  // Do not reject ARMv7 guests before the integrated runtime starts.
                  // LiveExec32 owns backend diagnostics; the host resolves the runtime
                  // and forwards the guest executable.
                  if(!isJitEnabled) {
                      NSLog(@"[LCBootstrap] Starting LiveExec32 without the legacy host JIT gate.");
                  }
                  
                  NSString *selected32BitLayerExecPath = nil;'''
          if old not in text:
              raise SystemExit('Expected LiveExec32 JIT gate block was not found')
          bootstrap.write_text(text.replace(old, new, 1))

          workflow = Path('.github/workflows/unsigned-ipa.yml')
          text = workflow.read_text()
          old_checkout = '''      - name: Checkout LiveExec32
                  uses: actions/checkout@v6
                  with:
                    repository: LiveContainer/LiveExec32
                    path: build/LiveExec32
          '''
          new_checkout = '''      - name: Checkout LiveExec32
                  uses: actions/checkout@v6
                  with:
                    repository: LiveContainer/LiveExec32
                    ref: 467edd814ba4a52f5785e6c10518b73be26b2259
                    path: build/LiveExec32

                - name: Patch bundled LiveExec32 integration
                  run: python3 scripts/patch_liveexec32.py build/LiveExec32
          '''
          if old_checkout not in text:
              raise SystemExit('Expected LiveExec32 checkout block was not found')
          workflow.write_text(text.replace(old_checkout, new_checkout, 1))

          source_updater = Path('.github/update_unsigned_source.py')
          text = source_updater.read_text()
          text = text.replace(
              '        "Requires a configured JIT provider such as StikDebug for 32-bit launches.",',
              '        "Starts the integrated LiveExec32 runtime directly; runtime backend errors are reported by LiveExec32 instead of a host JIT gate.",',
          )
          text = text.replace(
              '"description": "AltStore and SideStore source for unsigned real-device LiveContainer builds with bundled LiveExec32. 32-bit IPA support is experimental and still requires JIT.",',
              '"description": "AltStore and SideStore source for unsigned real-device LiveContainer builds with the integrated LiveExec32 ARMv7 runtime. 32-bit IPA support remains experimental.",',
          )
          source_updater.write_text(text)
          PY

          grep -q 'Starting LiveExec32 without the legacy host JIT gate' LiveContainer/LCBootstrap.m
          grep -q 'ref: 467edd814ba4a52f5785e6c10518b73be26b2259' .github/workflows/unsigned-ipa.yml
          grep -q 'scripts/patch_liveexec32.py' .github/workflows/unsigned-ipa.yml
          ! grep -q 'JIT is required to run 32-bit apps through LiveExec32' LiveContainer/LCBootstrap.m

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-liveexec32-runtime-once.yml
          git add LiveContainer/LCBootstrap.m .github/workflows/unsigned-ipa.yml .github/update_unsigned_source.py scripts/patch_liveexec32.py
          git commit -m 'Start LiveExec32 directly and own runtime diagnostics'
          git push origin HEAD:main
