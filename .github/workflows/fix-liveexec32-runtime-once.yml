name: Fix LiveExec32 runtime integration once

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/fix-liveexec32-runtime-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Repair 32-bit runtime launch path
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          bootstrap = Path('LiveContainer/LCBootstrap.m')
          text = bootstrap.read_text()
          old = '''    if(is32bit) {
                  if (!isJitEnabled) {
                      isJitEnabled = waitForJITEnabled(80, 1000 * 100);
                      if(isJitEnabled) {
                          init_bypassDyldLibValidation();
                      }
                  }
                  if (!isJitEnabled) {
                      return @"JIT is required to run 32-bit apps through LiveExec32.";
                  }
                  
                  NSString *selected32BitLayerExecPath = nil;'''
          new = '''    if(is32bit) {
                  // Do not reject ARMv7 guests before the integrated runtime starts.
                  // LiveExec32 owns executable-memory/backend diagnostics; the host only
                  // resolves the runtime and forwards the guest executable.
                  if(!isJitEnabled) {
                      NSLog(@"[LCBootstrap] Starting LiveExec32 without the legacy host JIT gate.");
                  }
                  
                  NSString *selected32BitLayerExecPath = nil;'''
          if old not in text:
              raise SystemExit('Expected LiveExec32 JIT gate block was not found')
          bootstrap.write_text(text.replace(old, new, 1))

          workflow = Path('.github/workflows/unsigned-ipa.yml')
          text = workflow.read_text()
          old_checkout = '''      - name: Checkout LiveExec32
                  uses: actions/checkout@v6
                  with:
                    repository: LiveContainer/LiveExec32
                    path: build/LiveExec32
          '''
          new_checkout = '''      - name: Checkout LiveExec32
                  uses: actions/checkout@v6
                  with:
                    repository: LiveContainer/LiveExec32
                    ref: 467edd814ba4a52f5785e6c10518b73be26b2259
                    path: build/LiveExec32

                - name: Patch bundled LiveExec32 integration
                  shell: bash
                  run: |
                    set -euo pipefail
                    python3 - <<'RUNTIMEPY'
                    from pathlib import Path

                    path = Path('build/LiveExec32/main.cpp')
                    source = path.read_text()
                    source = source.replace('#include <string.h>\n', '#include <string.h>\n#include <limits.h>\n#include <string>\n', 1)
                    constants = '''// /var/mobile/Documents/TrollExperiments/CProjects/dynarmic
                    #define DEFAULT_ROOT_PATH "/private/var/mobile/Documents/TrollExperiments/CProjects/dynarmic/iOS10RAMDisk"
                    #define DEFAULT_DYLD_PATH DEFAULT_ROOT_PATH "/usr/lib/dyld"
                    '''
                    helper = r'''static std::string LC32RuntimeRoot(const char *argv0) {
                      const char *configured = getenv("ROOT_PATH");
                      if(configured && configured[0]) {
                        return configured;
                      }

                      const char *lcHome = getenv("LC_HOME_PATH");
                      if(lcHome && lcHome[0]) {
                        return std::string(lcHome) + "/Documents/LiveExec32Runtime";
                      }

                      char resolved[PATH_MAX] = {0};
                      if(argv0 && realpath(argv0, resolved)) {
                        char *dir = dirname(resolved);
                        return std::string(dir) + "/RuntimeRoot";
                      }
                      return "RuntimeRoot";
                    }
                    '''
                    if constants not in source:
                        raise SystemExit('Expected LiveExec32 hard-coded runtime constants were not found')
                    source = source.replace(constants, helper, 1)

                    old_start = '''  Dynarmic_nativeInitialize();
                      u32 execAddr = Dynarmic_map_file(false, 0x11000000, execPath);

                      setenv("DYLD_PATH", DEFAULT_DYLD_PATH, 0);
                      const char *dyldPath = getenv("DYLD_PATH");
                      printf("Loading dyld at DYLD_PATH %s\\n", dyldPath);
                      Dynarmic_map_file(true, 0x10000000, dyldPath);
                      printf("entry point: 0x%x\\n", threadHandle.jit->Regs()[15]);

                      setenv("ROOT_PATH", DEFAULT_ROOT_PATH, 0);
                      const char *rootPath = getenv("ROOT_PATH");
                    '''
                    new_start = '''  std::string runtimeRoot = LC32RuntimeRoot(argv[0]);
                      std::string runtimeDyld = runtimeRoot + "/usr/lib/dyld";
                      setenv("ROOT_PATH", runtimeRoot.c_str(), 1);
                      setenv("DYLD_PATH", runtimeDyld.c_str(), 1);

                      if(access(runtimeDyld.c_str(), R_OK) != 0) {
                        fprintf(stderr, "LC32_RUNTIME_ROOT_MISSING: expected readable dyld at %s\\n", runtimeDyld.c_str());
                        fprintf(stderr, "Install the extracted 32-bit runtime at Documents/LiveExec32Runtime.\\n");
                        return 78;
                      }

                      if(!Dynarmic_nativeInitialize()) {
                        fprintf(stderr, "LC32_BACKEND_INIT_FAILED: the ARMv7 execution backend could not initialize.\\n");
                        return 70;
                      }
                      u32 execAddr = Dynarmic_map_file(false, 0x11000000, execPath);

                      const char *dyldPath = getenv("DYLD_PATH");
                      printf("Loading dyld at DYLD_PATH %s\\n", dyldPath);
                      Dynarmic_map_file(true, 0x10000000, dyldPath);
                      printf("entry point: 0x%x\\n", threadHandle.jit->Regs()[15]);

                      const char *rootPath = getenv("ROOT_PATH");
                    '''
                    if old_start not in source:
                        raise SystemExit('Expected LiveExec32 initialization block was not found')
                    path.write_text(source.replace(old_start, new_start, 1))
                    RUNTIMEPY
          '''
          if old_checkout not in text:
              raise SystemExit('Expected LiveExec32 checkout block was not found')
          workflow.write_text(text.replace(old_checkout, new_checkout, 1))

          source_updater = Path('.github/update_unsigned_source.py')
          text = source_updater.read_text()
          text = text.replace(
              '        "Requires a configured JIT provider such as StikDebug for 32-bit launches.",',
              '        "Starts the integrated LiveExec32 runtime directly; runtime backend errors are reported by LiveExec32 instead of a host JIT gate.",',
          )
          text = text.replace(
              '"description": "AltStore and SideStore source for unsigned real-device LiveContainer builds with bundled LiveExec32. 32-bit IPA support is experimental and still requires JIT.",',
              '"description": "AltStore and SideStore source for unsigned real-device LiveContainer builds with the integrated LiveExec32 ARMv7 runtime. 32-bit IPA support remains experimental.",',
          )
          source_updater.write_text(text)
          PY

          grep -q 'Starting LiveExec32 without the legacy host JIT gate' LiveContainer/LCBootstrap.m
          grep -q 'ref: 467edd814ba4a52f5785e6c10518b73be26b2259' .github/workflows/unsigned-ipa.yml
          grep -q 'LC32_RUNTIME_ROOT_MISSING' .github/workflows/unsigned-ipa.yml
          ! grep -q 'JIT is required to run 32-bit apps through LiveExec32' LiveContainer/LCBootstrap.m

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-liveexec32-runtime-once.yml
          git add LiveContainer/LCBootstrap.m .github/workflows/unsigned-ipa.yml .github/update_unsigned_source.py
          git commit -m 'Start LiveExec32 directly and own runtime diagnostics'
          git push origin HEAD:main
